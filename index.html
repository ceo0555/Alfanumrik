<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alfanumrik - Adaptive CBSE Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #f8fafc; /* slate-50 */
        --bg-app: #f1f5f9; /* slate-100 */
        --bg-content: #ffffff;
        --bg-sidebar: #1f2937; /* gray-800 */
        --border-color: #e2e8f0; /* slate-200 */
        --text-primary: #1e293b; /* slate-800 */
        --text-secondary: #64748b; /* slate-500 */
        --text-sidebar: #9ca3af; /* gray-400 */
        --text-sidebar-hover: #ffffff;
        --sidebar-active-bg: #374151; /* gray-700 */
        --brand-primary: #4f46e5; /* Indigo 600 */
        --brand-primary-hover: #4338ca; /* Indigo 700 */
        --brand-secondary: #eef2ff; /* Indigo 50 */
        --brand-gradient: linear-gradient(135deg, #6366f1, #4f46e5);
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --radius-sm: 0.25rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
      }

      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-main);
        background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
        background-size: 20px 20px;
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Poppins', sans-serif;
      }
      
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      .btn {
        padding: 0.625rem 1.25rem; /* 10px 20px */
        border-radius: var(--radius-md);
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        transition: all 0.2s ease-in-out;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .btn-primary {
        background-color: var(--brand-primary);
        color: white;
        box-shadow: var(--shadow-sm);
      }
      .btn-primary:hover:not(:disabled) {
        background-color: var(--brand-primary-hover);
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }
      .btn:disabled {
        background-color: #d1d5db; /* gray-300 */
        color: #6b7280; /* gray-500 */
        cursor: not-allowed;
        opacity: 0.7;
        transform: translateY(0);
        box-shadow: none;
      }
      
      .form-input, .form-select, .form-textarea {
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        transition: all 0.2s ease-in-out;
        padding: 0.625rem 1rem;
        background-color: #fff;
      }
      .form-input:focus, .form-select:focus, .form-textarea:focus {
        --tw-ring-color: var(--brand-primary);
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 2px var(--brand-secondary);
        outline: 2px solid transparent;
        outline-offset: 2px;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; /* slate-300 */
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; /* slate-400 */
      }
      
      /* Prose Overrides for Math Blocks */
      .prose pre {
        background-color: #f1f5f9; /* slate-100 */
        color: var(--text-primary);
        padding: 1rem;
        border-radius: var(--radius-md);
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        font-size: 0.9em;
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .prose pre code {
        background-color: transparent;
        padding: 0;
        font-size: inherit;
        color: inherit;
      }

      /* Reusable Animations */
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }

      @keyframes slide-in-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-in-up {
        animation: slide-in-up 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.98); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in {
        animation: scale-in 0.3s ease-out forwards;
      }
      
      @keyframes bounce-in {
        0% { transform: scale(0.5); opacity: 0; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); }
      }
      .animate-bounce-in {
        animation: bounce-in 0.4s ease-out forwards;
      }
    </style>

</head>
