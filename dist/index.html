<html lang="en">
  <head>

    <style>
      :root {
        /* Color Palette (Light Mode) */
        --bg-main: #F8FAFC; /* Pearl White */
        --bg-app: #F1F5F9;
        --bg-content: #FFFFFF;
        --bg-sidebar: #001F3F; /* Deep Space Blue */
        --text-primary: #0F172A; /* slate-900 */
        --text-secondary: #64748B; /* slate-500 */
        --text-tertiary: #94A3B8; /* slate-400 */
        --text-sidebar: #CBD5E1; /* slate-300 */
        --text-sidebar-hover: #FFFFFF;
        --border-color: #E2E8F0; /* slate-200 */
        --border-color-light: #F1F5F9; /* slate-100 */
        --sidebar-active-bg: rgba(0, 224, 255, 0.1); /* Electric Cyan transparent */
        --sidebar-active-text: #00E0FF; /* Electric Cyan */
        --brand-primary: #4F46E5; /* Indigo-600 */
        --brand-secondary: #00E0FF; /* Electric Cyan */
        --brand-gradient: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
        
        /* Glassmorphism */
        --glass-bg: rgba(255, 255, 255, 0.6);
        --glass-border: rgba(255, 255, 255, 0.2);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        --glass-blur: 10px;

        /* Sizing & Radius */
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1.25rem;

        /* Shadows */
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.07), 0 4px 6px -4px rgb(0 0 0 / 0.07);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      }

      html.dark {
        --bg-main: #020617; /* slate-950 */
        --bg-app: #0F172A; /* slate-900 */
        --bg-content: #1E293B; /* slate-800 */
        --text-primary: #F8FAFC; /* slate-50 */
        --text-secondary: #94A3B8; /* slate-400 */
        --text-tertiary: #475569; /* slate-600 */
        --border-color: #334155; /* slate-700 */
        --border-color-light: #1E293B; /* slate-800 */

        --glass-bg: rgba(30, 41, 59, 0.75);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      html {
        scroll-behavior: smooth;
      }

      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
      }
      
      body {
        font-family: 'Satoshi', 'Inter', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      h1, h2, h3, h4, h5, h6, .font-poppins {
        font-family: 'Poppins', sans-serif;
      }
      
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }
      
      .btn {
        padding: 0.625rem 1.25rem;
        border-radius: var(--radius-md);
        font-weight: 700;
        font-family: 'Satoshi', sans-serif;
        transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        outline: none;
        box-shadow: var(--shadow-sm);
      }
      .btn:focus-visible {
        box-shadow: 0 0 0 3px var(--brand-primary);
        outline: 2px solid transparent;
        outline-offset: 2px;
      }
      .btn-primary {
        background-color: var(--brand-primary);
        color: white;
      }
      .btn-primary:hover:not(:disabled) {
        box-shadow: var(--shadow-md);
        background-color: #4338ca; /* darker indigo */
        transform: translateY(-2px);
      }
      .btn:disabled {
        background-color: #d1d5db; /* gray-300 */
        color: #6b7280; /* gray-500 */
        cursor: not-allowed;
        opacity: 0.7;
        transform: translateY(0);
        box-shadow: none;
      }
      
      .form-input, .form-select, .form-textarea {
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        transition: all 0.2s ease-in-out;
        padding: 0.625rem 1rem;
        background-color: var(--bg-content);
        outline: none;
      }
      .form-input:focus, .form-select:focus, .form-textarea:focus {
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 3px var(--brand-secondary);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      html.dark ::-webkit-scrollbar-thumb { background: #475569; }
      html.dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
      
      /* Prose Styles for Markdown Renderer */
      .prose { white-space: pre-wrap; color: var(--text-primary); line-height: 1.65; font-size: 1rem; }
      @media (max-width: 768px) { .prose { font-size: 0.95rem; } }
      .prose h1, .prose h2, .prose h3 { font-family: 'Poppins', sans-serif; color: var(--brand-primary); margin-top: 1.5em; margin-bottom: 0.5em; }
      .prose strong { color: var(--brand-primary); font-weight: 700; }
      .prose p { margin-top: 0; margin-bottom: 1em; }
      .prose ul, .prose ol { padding-left: 1.5em; margin-top: 1em; margin-bottom: 1em; }
      .prose li { margin-bottom: 0.5em; padding-left: 0.5em; }
      .prose ul > li::marker { color: var(--brand-primary); font-size: 1.2em; }
      .prose ol > li::marker { color: var(--brand-primary); font-weight: 600; }
      .prose code { background-color: var(--bg-app); color: #dd1144; padding: 0.2em 0.4em; border-radius: 0.25rem; font-size: 0.9em; }
      .prose pre { background-color: var(--bg-app); color: var(--text-primary); padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 0.9em; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; }
      .prose pre code { background-color: transparent; padding: 0; font-size: inherit; color: inherit; }
      
      /* Animations */
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fade-in 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
      
      @keyframes slide-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slide-in-up { animation: slide-in-up 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
      
      @keyframes pop-in {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in { animation: pop-in 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

      @keyframes indeterminate-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .animate-indeterminate-progress { animation: indeterminate-progress 1.5s infinite ease-in-out; }
    </style>
